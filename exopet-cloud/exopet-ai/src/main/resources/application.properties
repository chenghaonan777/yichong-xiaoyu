server.port=9205

# 数据库
spring.datasource.url=jdbc:mysql://localhost:3306/exopet?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.application.name=exopet-ai
spring.cloud.nacos.discovery.enabled=true
spring.cloud.nacos.discovery.server-addr=localhost:8848
# 禁用 Nacos 配置中心（只用了服务发现，不需要配置管理）
spring.cloud.nacos.config.enabled=false
# AI 模型（硅基流动）
spring.ai.openai.api-key=${AI_API_KEY:sk-your-key-here}
spring.ai.openai.base-url=https://api.siliconflow.cn
spring.ai.openai.chat.options.model=Qwen/Qwen3-VL-8B-Instruct


spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

spring.cloud.sentinel.transport.dashboard=localhost:8718
spring.cloud.sentinel.eager=true

# MyBatis-Plus
mybatis-plus.mapper-locations=classpath*:mapper/*.xml
mybatis-plus.type-aliases-package=com.exopet.ai.entity

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.api-docs.path=/v3/api-docs
springdoc.group-configs[0].group=default
springdoc.group-configs[0].paths-to-match=/**
springdoc.group-configs[0].packages-to-scan=com.exopet.ai.controller
knife4j.enable=true
knife4j.setting.language=zh_cn
