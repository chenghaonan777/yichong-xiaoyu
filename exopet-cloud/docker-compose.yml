services:
  # ========== 中间件 ==========

  # Redis（认证中心需要）
  redis:
    image: redis:7
    container_name: exopet-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  # Nacos（服务注册与配置中心）
  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: exopet-nacos
    environment:
      MODE: standalone
    ports:
      - "8848:8848"
      - "9848:9848"
    restart: unless-stopped

  # RocketMQ（消息队列，替代原 Kafka）
  rocketmq-namesrv:
    image: apache/rocketmq:5.2.0
    container_name: exopet-rmq-namesrv
    environment:
      JAVA_OPT_EXT: "-server -Xms128m -Xmx256m"
    ports:
      - "9876:9876"
    command: sh mqnamesrv
    restart: unless-stopped

  rocketmq-broker:
    image: apache/rocketmq:5.2.0
    container_name: exopet-rmq-broker
    environment:
      JAVA_OPT_EXT: "-server -Xms128m -Xmx256m"
      NAMESRV_ADDR: rocketmq-namesrv:9876
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    volumes:
      - ./rocketmq/broker.conf:/etc/rocketmq/broker.conf
    command: sh mqbroker -c /etc/rocketmq/broker.conf
    depends_on:
      - rocketmq-namesrv
    restart: unless-stopped

  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: exopet-rmq-dashboard
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=rocketmq-namesrv:9876"
    ports:
      - "8081:8082"
    depends_on:
      - rocketmq-namesrv
    restart: unless-stopped

volumes:
  redis-data:
  rmq-data:
