server.port=9209

spring.application.name=exopet-notification
# Nacos 注册中心
spring.cloud.nacos.discovery.server-addr=localhost:8848
spring.cloud.nacos.discovery.enabled=true

# 数据源
spring.datasource.url=jdbc:mysql://localhost:3306/exopet?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis-Plus
mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.banner=false

# RocketMQ
rocketmq.name-server=localhost:9876
# 消费者：通知推送
rocketmq.consumers.notification-push.group=exopet-notification-push-group
rocketmq.consumers.notification-push.topic=notification-push
# 消费者：问诊提醒
rocketmq.consumers.consult-remind.group=exopet-consult-remind-group
rocketmq.consumers.consult-remind.topic=consult-remind
# 消费者：健康提醒
rocketmq.consumers.pet-health-remind.group=exopet-pet-health-remind-group
rocketmq.consumers.pet-health-remind.topic=pet-health-remind
