server.port=9200

spring.application.name=exopet-auth
spring.cloud.nacos.discovery.enabled=true
spring.cloud.nacos.discovery.server-addr=localhost:8848
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
spring.datasource.url=jdbc:mysql://localhost:3306/exopet?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

jwt.secret=${JWT_SECRET:ExoPet2026SecretKeyForJWTTokenGenerationMustBeLongEnough}
jwt.expire=604800

#spring.cloud.sentinel.transport.dashboard=localhost:8718
#spring.cloud.sentinel.eager=true

# MyBatis-Plus
mybatis-plus.mapper-locations=classpath*:mapper/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=auto

# 阿里云号码认证
aliyun.sms.access-key-id=${ALIYUN_SMS_ACCESS_KEY_ID:your-access-key-id}
aliyun.sms.access-key-secret=${ALIYUN_SMS_ACCESS_KEY_SECRET:your-access-key-secret}
aliyun.sms.endpoint=dypnsapi.aliyuncs.com
aliyun.sms.country-code=86
aliyun.sms.sign-name=恒创联众
aliyun.sms.template-code=100001
aliyun.sms.template-param={"code":"##code##","min":"5"}
aliyun.sms.code-length=6
aliyun.sms.code-type=1
aliyun.sms.valid-time=300
aliyun.sms.interval=60
aliyun.sms.duplicate-policy=1
