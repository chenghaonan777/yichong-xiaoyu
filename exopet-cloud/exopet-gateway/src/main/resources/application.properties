server.port=8080

spring.application.name=exopet-gateway
spring.cloud.nacos.discovery.enabled=true
spring.cloud.nacos.discovery.server-addr=localhost:8848
# Gateway Routes
# 认证中心
spring.cloud.gateway.routes[0].id=exopet-auth
spring.cloud.gateway.routes[0].uri=lb://exopet-auth
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**
# 用户服务
spring.cloud.gateway.routes[1].id=exopet-user
spring.cloud.gateway.routes[1].uri=lb://exopet-user
spring.cloud.gateway.routes[1].predicates[0]=Path=/user/**
# 问诊服务
spring.cloud.gateway.routes[2].id=exopet-consult
spring.cloud.gateway.routes[2].uri=lb://exopet-consult
spring.cloud.gateway.routes[2].predicates[0]=Path=/consult/**
# AI诊断服务
spring.cloud.gateway.routes[3].id=exopet-ai
spring.cloud.gateway.routes[3].uri=lb://exopet-ai
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/ai/**
# 宠物服务
spring.cloud.gateway.routes[4].id=exopet-pet
spring.cloud.gateway.routes[4].uri=lb://exopet-pet
spring.cloud.gateway.routes[4].predicates[0]=Path=/pet/**
# 医院服务
spring.cloud.gateway.routes[5].id=exopet-hospital
spring.cloud.gateway.routes[5].uri=lb://exopet-hospital
spring.cloud.gateway.routes[5].predicates[0]=Path=/hospital/**

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=0

# JWT Secret - 用于 Redis 不可用时本地解析 Token（与 exopet-auth 保持一致）
jwt.secret=${JWT_SECRET:ExoPet2026SecretKeyForJWTTokenGenerationMustBeLongEnough}

logging.level.com.exopet=debug
