server:
  port: 8080

spring:
  application:
    name: exopet-gateway
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    gateway:
      routes:
        # 认证中心
        - id: exopet-auth
          uri: lb://exopet-auth
          predicates:
            - Path=/auth/**
        # 用户服务
        - id: exopet-user
          uri: lb://exopet-user
          predicates:
            - Path=/user/**
        # 问诊服务
        - id: exopet-consult
          uri: lb://exopet-consult
          predicates:
            - Path=/consult/**
        # AI诊断服务
        - id: exopet-ai
          uri: lb://exopet-ai
          predicates:
            - Path=/api/ai/**
        # 宠物服务
        - id: exopet-pet
          uri: lb://exopet-pet
          predicates:
            - Path=/pet/**
        # 医院服务
        - id: exopet-hospital
          uri: lb://exopet-hospital
          predicates:
            - Path=/hospital/**

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0

# JWT Secret — 用于 Redis 不可用时本地解析 Token（与 exopet-auth 保持一致）
jwt:
  secret: ${JWT_SECRET:ExoPet2026SecretKeyForJWTTokenGenerationMustBeLongEnough}

logging:
  level:
    com.exopet: debug
